[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvstat"
version = "0.1.0"
description = "A small command-line tool that reports per-column statistics for a CSV file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
csvstat = "csvstat.cli:main"

[tool.setuptools.packages.find]
include = ["csvstat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
